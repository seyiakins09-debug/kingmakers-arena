services:
  - type: web
    name: kingmakers-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingmakers-arena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HOST_PASSWORD
        sync: false
databases:
  - name: kingmakers-arena-db
    plan: free
